 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://xn--mami-epa.ch/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Noah Mamié" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <title><%- metaTitle %></title>
    <!--
      Avoid a flash of unstyled content: #root ships crawlable static HTML
      (see seo.ts). Visitors with JavaScript never need it, so hide it until
      React replaces it, and paint the saved theme's paper colour right away.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('gitprofile-theme');
          if (t) d.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #ffffff; }
      html[data-theme='scholar-dark'] { background: #161513; }
      html.js #prerender { display: none; }
    </style>

    <meta name="description" content="<%- metaDescription %>" />

    <meta itemprop="name" content="<%- metaTitle %>" />
    <meta itemprop="description" content="<%- metaDescription %>" />
    <meta itemprop="image" content="<%- metaImageURL %>" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://xn--mami-epa.ch/" />
    <meta property="og:site_name" content="Noah Mamié" />
    <meta property="og:locale" content="en_US" />
    <meta property="profile:first_name" content="Noah" />
    <meta property="profile:last_name" content="Mamié" />
    <meta property="og:image:alt" content="Noah Mamié logo" />
    <meta property="og:title" content="<%- metaTitle %>" />
    <meta property="og:description" content="<%- metaDescription %>" />
    <meta property="og:image" content="<%- metaImageURL %>" />
    <meta property="og:image:secure_url" content="<%- metaImageURL %>" />

    <meta name="twitter:card" content="summary" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:title" content="<%- metaTitle %>" />
    <meta name="twitter:description" content="<%- metaDescription %>" />
    <meta name="twitter:image" content="<%- metaImageURL %>" />
    <%- googleAnalyticsScript %>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

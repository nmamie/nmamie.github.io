name: Sync Publication Citations

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Citation Sync Script
        run: node scripts/update-citations.mjs

      - name: Commit & Push if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gitprofile.config.ts
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(citations): auto-sync publication citation counts"
            git push
          else
            echo "No citation changes detected."
          fi
